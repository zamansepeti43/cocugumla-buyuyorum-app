<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620">
<style>
  .leo{transform-origin:240px 590px;animation:breathe 2.8s ease-in-out infinite}
  .wave{transform-origin:327px 366px;animation:wave 1.9s ease-in-out infinite}
  .paw{transform-origin:404px 274px;animation:paw 1.9s ease-in-out infinite}
  .tail{transform-origin:330px 440px;animation:tail 2.2s ease-in-out infinite}
  .blink{animation:blink 4.5s infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes wave{0%,35%,100%{transform:rotate(0)}45%{transform:rotate(-5deg)}55%{transform:rotate(6deg)}65%{transform:rotate(-4deg)}}
  @keyframes paw{0%,35%,100%{transform:rotate(0)}45%{transform:rotate(-12deg)}55%{transform:rotate(10deg)}65%{transform:rotate(-7deg)}}
  @keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
</style>

name: Download animation assets

on:
  push:
    paths:
      - '.github/workflows/download-animation-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CC0 animated characters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/animations/cc0

          download_oga_zip() {
            local page="$1"
            local fallback="$2"
            local output="$3"
            local href
            href=$(curl -fsSL "$page" | grep -oE 'href="[^"]+\.zip"' | grep -i "$fallback" | head -n 1 | sed -E 's/^href="//; s/"$//') || true
            if [ -z "${href:-}" ]; then
              href="/sites/default/files/$fallback"
            fi
            case "$href" in
              http*) url="$href" ;;
              /*) url="https://opengameart.org$href" ;;
              *) url="https://opengameart.org/$href" ;;
            esac
            echo "Downloading $url"
            curl -fL --retry 3 "$url" -o "$output"
          }

          download_oga_zip \
            'https://opengameart.org/content/cute-ducky-duck-character' \
            'fowl_animal_ducky.zip' \
            'public/animations/cc0/fowl_animal_ducky.zip'

          download_oga_zip \
            'https://opengameart.org/content/cute-teddy-bear-character' \
            'fat_animal_teddy.zip' \
            'public/animations/cc0/fat_animal_teddy.zip'

          mkdir -p public/animations/cc0/duck public/animations/cc0/teddy
          unzip -o 'public/animations/cc0/fowl_animal_ducky.zip' -d public/animations/cc0/duck
          unzip -o 'public/animations/cc0/fat_animal_teddy.zip' -d public/animations/cc0/teddy
          rm 'public/animations/cc0/fowl_animal_ducky.zip' 'public/animations/cc0/fat_animal_teddy.zip'

          find public/animations/cc0 -type f | sort > public/animations/cc0/MANIFEST.txt

      - name: Commit downloaded assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/animations/cc0
          if git diff --cached --quiet; then
            echo 'No new assets to commit.'
            exit 0
          fi
          git commit -m 'assets: add CC0 animated child-friendly characters [skip ci]'
          git push
